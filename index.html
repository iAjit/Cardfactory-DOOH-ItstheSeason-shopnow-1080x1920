  <script type="text/javascript" id="gwd-init-code">
    (function() {
      var gwdAd = document.getElementById('gwd-ad');

      var containerStoreName = document.getElementById('nearstoreName');

      containerStoreName.style.opacity = '0';
      containerStoreName.style.transition = 'opacity 0.5s ease';

      let fallbackImage = document.getElementById('Cardfactory-DOOH-ItstheSeason-shopnow-1080x1920_fallback');

      // State flags
      let calculationsComplete = false;
      let videoLoaded = false;
      let videoRendered = false;
      let fallbackImageLoaded = false;
      let fontsLoaded = false;
      let vioohReadySent = false;
      let isFallbackMode = false;

      // Helper: Fired only after browser has physically painted the visual frame to screen
      function dispatchReadyAfterPaint() {
        if (vioohReadySent) return;
        vioohReadySent = true;

        // Double requestAnimationFrame guarantees DOM style swaps & GPU painting are 100% committed
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            console.log("Visuals painted to glass. Dispatching viooh.ready.");
            window.parent.postMessage({
              event: "viooh.ready"
            }, "*");
          });
        });
      }

      // ========================================================
      // DIRECT FONT CHECK (FSAlbert-Bold & FSAlbert-Regular 58px)
      // ========================================================
      function checkFontsLoaded() {
        const boldFont = '65px "OpenSans-Regular"';
        const regularFont = '65px "OpenSans-Regular"';

        if (!document.fonts) {
          fontsLoaded = true;
          checkVioohReady();
          return;
        }

        if (document.fonts.check(boldFont) && document.fonts.check(regularFont)) {
          console.log("65px OpenSans-Regular fonts confirmed loaded directly.");
          fontsLoaded = true;
          checkVioohReady();
          return;
        }

        Promise.all([
          document.fonts.load(boldFont),
          document.fonts.load(regularFont),
          document.fonts.ready
        ]).then(function() {
          console.log("65px OpenSans-Regular fonts loaded and layout ready directly.");
          fontsLoaded = true;
          checkVioohReady();
        }).catch(function(err) {
          console.warn("Font loading error:", err);
          fontsLoaded = true;
          checkVioohReady();
        });
      }

      // ========================================================
      // VIDEO ACCESS & DOWNLOAD MONITORING
      // ========================================================
      var gwdVideoComponent = document.getElementById("Cardfactory-DOOH-ItstheSeason-shopnow-1080x1920_1");
      var videoElement = null;

      if (gwdVideoComponent) {
        videoElement = gwdVideoComponent.querySelector("video") || gwdVideoComponent;

        if (videoElement) {
          var runProgressCalculation = function() {
            if (videoElement.buffered.length > 0) {
              var bufferedEnd = videoElement.buffered.end(videoElement.buffered.length - 1);
              var percentLoaded = (bufferedEnd / videoElement.duration) * 100;

              console.log("Progress calculation: " + percentLoaded.toFixed(1) + "%");

              if (percentLoaded >= 100) {
                console.log("Success! Video is 100% loaded.");
                videoElement.removeEventListener("progress", runProgressCalculation);
                videoElement.removeEventListener("canplaythrough", runProgressCalculation);
                videoElement.removeEventListener("loadeddata", runProgressCalculation);
                videoElement.removeEventListener("loadedmetadata", runProgressCalculation);

                videoLoaded = true;
                checkVioohReady();
              }
            }
          };

          videoElement.preload = "auto";
          videoElement.addEventListener("progress", runProgressCalculation);
          videoElement.addEventListener("canplaythrough", runProgressCalculation);
          videoElement.addEventListener("loadeddata", runProgressCalculation);
          videoElement.addEventListener("loadedmetadata", runProgressCalculation);

          if (videoElement.readyState >= 1) {
            runProgressCalculation();
          } else {
            var videoSrc = videoElement.src || gwdVideoComponent.getAttribute("sources") || gwdVideoComponent.getAttribute("src");
            if (videoSrc && (!videoElement.src || videoElement.src === "")) {
              videoElement.src = videoSrc;
            }
            videoElement.load();
            runProgressCalculation();
          }
        }
      }

      // Check if first video frame is decoded
      function checkVideoRendered() {
        if (videoRendered || !videoElement) return;

        if (videoElement.readyState >= 2) {
          if ("requestVideoFrameCallback" in videoElement) {
            if (videoElement.currentTime === 0) {
              videoElement.currentTime = 0.001;
            }
            videoElement.requestVideoFrameCallback(function() {
              videoRendered = true;
              checkVioohReady();
            });
          } else {
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                videoRendered = true;
                checkVioohReady();
              });
            });
          }
        } else {
          setTimeout(checkVideoRendered, 20);
        }
      }

      // ========================================================
      // READINESS GATE: Performs DOM Swap first, paints, then posts
      // ========================================================
      function checkVioohReady() {
        if (vioohReadySent) return;

        // SCENARIO A: Fallback image mode
        if (isFallbackMode) {
          if (calculationsComplete && fallbackImageLoaded) {
            if (videoElement) {
              videoElement.style.display = "none";
            }
            if (fallbackImage) {
              fallbackImage.style.display = "block";
            }

            // Let the browser paint the display change before posting ready
            dispatchReadyAfterPaint();
          }
        }
        // SCENARIO B: Dynamic Video Mode
        else {
          if (calculationsComplete && videoLoaded && videoRendered && fontsLoaded) {
            if (videoElement) {
              videoElement.style.display = "block";
            }
            if (fallbackImage) {
              fallbackImage.style.display = "none";
            }

            // Let the browser paint the display change before posting ready
            dispatchReadyAfterPaint();
          }
        }
      }

      // ========================================================
      // DOM CONTENT LOADED: Store calculations
      // ========================================================
      function handleDomContentLoaded(event) {
        var userLatitude;
        var userLongitude;

        var qs = new URLSearchParams(window.location.search);
        var vioohAssetId = qs.get("viooh_asset_id");
        //vioohAssetId = "1234933238";
        if (typeof frameListData !== 'undefined' && frameListData) {
          var locationData = {};
          for (var i = 0; i < frameListData.length; i++) {
            var row = frameListData[i];
            locationData[row["Frame ID"]] = {
              lat: parseFloat(row["Lat"]),
              lon: parseFloat(row["Long"])
            };
          }
        }

        if (vioohAssetId && typeof frameListData !== 'undefined' && frameListData) {
          if (locationData && locationData[vioohAssetId]) {
            userLatitude = locationData[vioohAssetId].lat;
            userLongitude = locationData[vioohAssetId].lon;
            console.log(`DOOH Frame Location → Lat: ${userLatitude}, Long: ${userLongitude}`);
          }
        }

        fetchLocation();

        function fetchLocation() {
          if (userLatitude && userLongitude && typeof locationListData !== 'undefined' && locationListData.values) {
            var currentLat = userLatitude;
            var currentLon = userLongitude;
            var nearestStore = null;
            var minDistance = Infinity;

            for (var i = 0; i < locationListData.values.length; i++) {
              var store = locationListData.values[i];
              var StoreName = store["StoreName"];
              var storeMessage = store["Message"];
              var storeLat = parseFloat(store["Latitude"]);
              var storeLon = parseFloat(store["Longitude"]);
              var distance = getDistanceFromLatLonInKm(currentLat, currentLon, storeLat, storeLon);

              if (distance < minDistance) {
                minDistance = distance;
                nearestStore = {
                  name: StoreName,
                  add: storeMessage,
                  lat: storeLat,
                  lon: storeLon
                };
              }
            }

            if (nearestStore) {
              console.log('Nearest Store:', nearestStore.name);
              console.log('Distance:', minDistance.toFixed(2), 'km');
              var walkingTime = calculateWalkingTime(minDistance, 5);
              console.log('Walking Time: ', walkingTime.toFixed(2), ' minutes');
              const containerStoreName = document.getElementById('nearstoreName');
              containerStoreName.innerHTML = `${nearestStore.name}`;

              containerStoreName.style.fontFamily = 'OpenSans-Regular';
            }
          } else {
            console.log('Activating fallback Image layout. Disabling Video Mode');
            const containerStoreName = document.getElementById('nearstoreName');
            if (containerStoreName) {
              containerStoreName.innerHTML = ` `;
            }

            if (videoElement) {
              videoElement.pause();
              videoElement.removeAttribute("src");
              videoElement.src = "";
              videoElement.load();
            }

            videoLoaded = false;
            videoRendered = false;
            isFallbackMode = true;
          }

          calculationsComplete = true;
          console.log("Dynamic calculations completed.");
          checkVioohReady();
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
          var R = 6371;
          var dLat = deg2rad(lat2 - lat1);
          var dLon = deg2rad(lon2 - lon1);
          var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
          var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          return R * c;
        }

        function deg2rad(deg) {
          return deg * (Math.PI / 180);
        }

        function calculateWalkingTime(distanceInKm, walkingSpeed = 5) {
          var timeInHours = distanceInKm / walkingSpeed;
          return timeInHours * 60;
        }

        function triggerPlay() {
          if (videoElement && !isFallbackMode) {
            videoElement.play();
            console.log("Video Started playing...");
            setTimeout(() => {
              containerStoreName.style.opacity = '1';
            }, 2000);
          }
        }

        window.addEventListener('message', function(event) {
          if (event.data && event.data.event === 'viooh.play') {
            console.log("viooh.play Event received");
            triggerPlay();
          }
        }, false);
      }

      // ========================================================
      // FALLBACK IMAGE ON-STAGE CHECK
      // ========================================================
      function checkForFallbackImageLoaded() {
        const creativeElement = document.getElementById('Cardfactory-DOOH-ItstheSeason-shopnow-1080x1920_fallback');

        if (!creativeElement) {
          fallbackImageLoaded = true;
          checkVioohReady();
          return;
        }

        const realImg = (creativeElement.shadowRoot && creativeElement.shadowRoot.querySelector('img')) ||
          (creativeElement.tagName === 'IMG' ? creativeElement : creativeElement.querySelector('img')) ||
          creativeElement;

        if (realImg.complete && realImg.naturalWidth > 0) {
          fallbackImageLoaded = true;
          checkVioohReady();
        } else {
          setTimeout(checkForFallbackImageLoaded, 10);
        }
      }

      // ========================================================
      // GWD AD LIFECYCLE
      // ========================================================
      function handleWebComponentsReady(event) {
        requestAnimationFrame(function() {
          setTimeout(function() {
            console.log("Init ad called");
            if (gwdAd && typeof gwdAd.initAd === 'function') {
              gwdAd.initAd();
            }

            if (isFallbackMode) {
              checkForFallbackImageLoaded();
            } else {
              checkFontsLoaded();
              checkVideoRendered();
            }
          }, 1);
        });
      }

      function handleAdInitialized(event) {}

      window.addEventListener('DOMContentLoaded', handleDomContentLoaded, false);
      window.addEventListener('WebComponentsReady', handleWebComponentsReady, false);
      window.addEventListener('adinitialized', handleAdInitialized, false);
    })();
  </script>
